<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B"/>
      <stop offset="55%" stop-color="#0A0F1A"/>
      <stop offset="100%" stop-color="#06131C"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nebulaGlow" cx="82%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.12"/>
      <stop offset="45%" stop-color="#0284C7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#05070B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Outer Frame -->
  <rect width="1200" height="260" rx="14" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5"/>
  <rect width="1200" height="260" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="260" rx="14" fill="url(#nebulaGlow)"/>

  <!-- Deep-Space Astrometry Reticle (Right Side) -->
  <g transform="translate(970, 118)" opacity="0.55">
    <circle cx="0" cy="0" r="88" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="56" fill="none" stroke="#00F5D4" stroke-width="0.75" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.5"/>
    <line x1="-105" y1="0" x2="105" y2="0" stroke="#1E293B" stroke-width="0.8"/>
    <line x1="0" y1="-105" x2="0" y2="105" stroke="#1E293B" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="2.5" fill="#00F5D4"/>
    <circle cx="38" cy="-29" r="1.5" fill="#E2E8F0"/>
    <circle cx="-46" cy="24" r="1.2" fill="#38BDF8"/>
    <circle cx="62" cy="34" r="1" fill="#94A3B8"/>
    <circle cx="-28" cy="-52" r="1.4" fill="#00F5D4"/>
    <text x="10" y="-62" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" letter-spacing="1">RA 05h 34m 31s</text>
    <text x="10" y="-50" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" letter-spacing="1">DEC +22° 00' 52"</text>
  </g>

  <!-- Top Telemetry Bar -->
  <text x="48" y="42" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="2">SYS.ID // 0xMASTROPHOT · PROTOCOL ENGINEERING &amp; DEEP-SPACE OPTICS</text>

  <!-- Main Title -->
  <text x="48" y="102" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="1.5">MAX BUTRIK</text>
  <text x="332" y="102" fill="#00F5D4" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" font-weight="600" letter-spacing="1">/ @mastrophot</text>

  <!-- Subtitle -->
  <text x="48" y="138" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" letter-spacing="0.3">Web3 Infrastructure, Rust/WASM Smart Contracts, Autonomous Agents &amp; Deep-Sky Astrophotography</text>

  <!-- Accent Divider -->
  <rect x="48" y="160" width="760" height="1.5" fill="url(#accentLine)"/>

  <!-- Bottom Telemetry Pills -->
  <g transform="translate(48, 196)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5">
    <circle cx="6" cy="-4" r="4" fill="#00F5D4"/>
    <text x="18" y="0" fill="#E2E8F0" font-weight="600">CORE:</text>
    <text x="60" y="0" fill="#94A3B8">Rust · WASM · TypeScript · Python · Solidity</text>

    <text x="395" y="0" fill="#38BDF8" font-weight="600">CRYPTO:</text>
    <text x="455" y="0" fill="#94A3B8">Threshold MPC · BIP-143 · EIP-1559 · Ed25519 · AES-256-GCM</text>
  </g>

  <g transform="translate(48, 222)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">
    <text x="0" y="0" fill="#64748B">FOCUS: Zero-Trust On-Chain Verifiers, Multichain Execution &amp; Model Context Protocol (MCP)</text>
  </g>
</svg>
